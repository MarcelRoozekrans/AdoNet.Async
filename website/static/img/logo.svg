<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="chevron1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="chevron2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="dot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- First chevron >> -->
  <polyline
    points="120,160 240,256 120,352"
    fill="none"
    stroke="url(#chevron1)"
    stroke-width="48"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Second chevron >> -->
  <polyline
    points="240,160 360,256 240,352"
    fill="none"
    stroke="url(#chevron2)"
    stroke-width="48"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Async dot -->
  <circle cx="420" cy="256" r="32" fill="url(#dot)"/>
</svg>
