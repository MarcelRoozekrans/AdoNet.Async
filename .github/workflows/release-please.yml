name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so bot PRs
      # never got their required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: simple
          # The release bot App token from the step above, not GITHUB_TOKEN.
          #
          # A release PR opened with GITHUB_TOKEN does not get its checks run
          # normally: they land in action_required and wait for a human. This
          # repository requires build-test to merge, so the release PR became
          # permanently unmergeable and 1.4.0 sat unreleased until the runs were
          # approved by hand. The App token replaces the RELEASE_PLEASE_TOKEN PAT
          # used before: it does not expire and does not act as a person.
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release -p:Version=${{ needs.release-please.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/System.Data.Async/System.Data.Async.csproj -c Release --no-build -p:Version=${{ needs.release-please.outputs.version }} -o ./nupkg
          dotnet pack src/System.Data.Async.Adapters/System.Data.Async.Adapters.csproj -c Release --no-build -p:Version=${{ needs.release-please.outputs.version }} -o ./nupkg
          dotnet pack src/System.Data.Async.DataSet/System.Data.Async.DataSet.csproj -c Release --no-build -p:Version=${{ needs.release-please.outputs.version }} -o ./nupkg
          dotnet pack src/System.Data.Async.DataSet.Generator/System.Data.Async.DataSet.Generator.csproj -c Release --no-build -p:Version=${{ needs.release-please.outputs.version }} -o ./nupkg
          dotnet pack src/System.Data.Async.Serialization.NewtonsoftJson/System.Data.Async.Serialization.NewtonsoftJson.csproj -c Release --no-build -p:Version=${{ needs.release-please.outputs.version }} -o ./nupkg
          dotnet pack src/System.Data.Async.Serialization.SystemTextJson/System.Data.Async.Serialization.SystemTextJson.csproj -c Release --no-build -p:Version=${{ needs.release-please.outputs.version }} -o ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload to GitHub Release
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./nupkg/*.nupkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
