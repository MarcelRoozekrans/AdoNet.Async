name: Release Please

on:
  push:
    # release/N.x holds maintenance patches of an earlier major. Each such branch has its own
    # manifest, and target-branch below makes release-please open its release PR there.
    branches: [main, 'release/**']

permissions:
  contents: write
  pull-requests: write

# One run per branch at a time, queued, not cancelled: a cancelled run could drop a release
# or its publish.
concurrency:
  group: release-please-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so bot PRs
      # never got their required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          # The release bot App token from the step above, not GITHUB_TOKEN.
          #
          # A release PR opened with GITHUB_TOKEN does not get its checks run
          # normally: they land in action_required and wait for a human. This
          # repository requires build-test to merge, so the release PR became
          # permanently unmergeable and 1.4.0 sat unreleased until the runs were
          # approved by hand. The App token replaces the RELEASE_PLEASE_TOKEN PAT
          # used before: it does not expire and does not act as a person.
          target-branch: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

  # GitHub marks every new release Latest, because release-please sets no make_latest. A release
  # from release/N.x patches an older major, so it took the flag from the newest main-line release.
  # This job gives the flag back to the highest released version. It is a job of its own so that a
  # failure here never holds up publish, and it reads the releases instead of this run's outputs,
  # so a re-run repairs the flag whatever failed before. It runs even when release-please failed
  # after creating the release.
  keep-latest:
    needs: release-please
    if: ${{ !cancelled() && github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Give Latest back to the highest released version
        run: |
          set -euo pipefail
          # Checked again after each edit: a main-line release published in the meantime is
          # higher, so the next round gives the flag to it. Three edits, four checks.
          for round in 1 2 3 4; do
            want=$(gh release list --exclude-drafts --exclude-pre-releases --limit 500 --json tagName -q '.[].tagName' \
              | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sort -V | tail -1)
            [ -n "$want" ] || { echo "No stable release yet"; exit 0; }
            now=$(gh release view --json tagName -q .tagName 2>/dev/null || echo none)
            if [ "$want" = "$now" ]; then echo "Latest is $now"; exit 0; fi
            [ "$round" -lt 4 ] || break
            echo "Latest is $now; giving the flag to $want"
            # A failed edit, such as a transient API error, is retried by the next round.
            gh release edit "$want" --latest || echo "::warning::Could not give Latest to $want; retrying"
            sleep 10
          done
          echo "::error::Latest did not settle on the highest release"; exit 1

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # id-token: write lets NuGet/login exchange the OIDC token for a short-lived API key.
    # A job-level block replaces the workflow-level one, so the other permissions are repeated.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build -c Release -p:Version=${{ needs.release-please.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/System.Data.Async/System.Data.Async.csproj -c Release --no-build -p:Version=${{ needs.release-please.outputs.version }} -o ./nupkg
          dotnet pack src/System.Data.Async.Adapters/System.Data.Async.Adapters.csproj -c Release --no-build -p:Version=${{ needs.release-please.outputs.version }} -o ./nupkg
          dotnet pack src/System.Data.Async.DataSet/System.Data.Async.DataSet.csproj -c Release --no-build -p:Version=${{ needs.release-please.outputs.version }} -o ./nupkg
          dotnet pack src/System.Data.Async.DataSet.Generator/System.Data.Async.DataSet.Generator.csproj -c Release --no-build -p:Version=${{ needs.release-please.outputs.version }} -o ./nupkg
          dotnet pack src/System.Data.Async.Serialization.NewtonsoftJson/System.Data.Async.Serialization.NewtonsoftJson.csproj -c Release --no-build -p:Version=${{ needs.release-please.outputs.version }} -o ./nupkg
          dotnet pack src/System.Data.Async.Serialization.SystemTextJson/System.Data.Async.Serialization.SystemTextJson.csproj -c Release --no-build -p:Version=${{ needs.release-please.outputs.version }} -o ./nupkg

      # Trusted publishing: nuget.org holds a policy for this repository and workflow file, and NuGet/login
      # swaps this job's OIDC token for an API key that lasts about an hour. NUGET_USER is the nuget.org profile name.
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload to GitHub Release
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./nupkg/*.nupkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A CycloneDX SBOM of the solution, attached to the same release. release-please created the release in the job
      # above, and this job runs on the pushed branch, so the tag comes from release-please's tag_name output, not github.ref_name.
      - name: Attach the SBOM to the GitHub release
        uses: MarcelRoozekrans/ci-baseline/actions/sbom@v1
        with:
          solution: System.Data.Async.slnx
          tag: ${{ needs.release-please.outputs.tag_name }}
